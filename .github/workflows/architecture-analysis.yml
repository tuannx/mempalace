name: Architecture Analysis

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  architecture:
    uses: ./.github/workflows/architecture-analysis-reusable.yml
    with:
      source-path: .
      primary-algorithm: pkg
      baseline-workflow-id: architecture-analysis.yml
      tooling-repository: ${{ github.repository }}
      tooling-ref: ${{ github.sha }}
    secrets: inherit